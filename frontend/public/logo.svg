<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 外圈虚线 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#a8d8d8" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#c8e8e8" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- 主背景圆 -->
  <circle cx="100" cy="100" r="75" fill="url(#bgGradient)"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8e6e6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Z 字母主体 - 青色 -->
  <path d="M55 55 L130 55 C138 55 140 58 140 65 C140 72 135 75 130 75 L78 75 L130 130 C132 132 130 145 120 145 L50 145 C42 145 40 140 40 135 C40 128 45 125 50 125 L102 125 L50 70 C48 68 50 55 55 55 Z" 
        fill="#3bb8b8" stroke="#3bb8b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 橙色装饰点 -->
  <ellipse cx="68" cy="85" rx="8" ry="6" fill="#f5a623" transform="rotate(-35 68 85)"/>
  <ellipse cx="68" cy="115" rx="8" ry="6" fill="#f5a623" transform="rotate(-35 68 115)"/>
  <ellipse cx="112" cy="85" rx="8" ry="6" fill="#f5a623" transform="rotate(35 112 85)"/>
  <ellipse cx="112" cy="115" rx="8" ry="6" fill="#f5a623" transform="rotate(35 112 115)"/>
</svg>

