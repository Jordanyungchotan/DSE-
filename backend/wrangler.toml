# Cloudflare Workers 配置
name = "dse-analysis-api"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# D1 数据库绑定
# 部署前请先创建数据库：wrangler d1 create dse-database
# 然后将返回的 database_id 填入下方
[[d1_databases]]
binding = "DB"
database_name = "dse-database"
database_id = "ebac4d13-515a-453c-9a93-7ef16c747989"

# 环境变量（敏感信息请在 Dashboard 中设置）
[vars]
CORS_ORIGIN = "https://dse-analysis.pages.dev"

